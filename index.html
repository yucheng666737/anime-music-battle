<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="referrer" content="strict-origin-when-cross-origin" />
<title>動漫神曲二選一</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet" />
<!-- 本地／部署金鑰由 config.js 提供（已列入 .gitignore，勿提交至 Git）；缺少時仍可玩單人模式 -->
<script src="./config.js" onerror="window.__CONFIG_MISSING=true"></script>
<style>
:root{
  --blue:#3b6fe0; --red:#e0414f; --gold:#f5c451; --green:#5ad08a;
  --bg:#0a0e16; --panel:#141b26; --panel2:#1b2433; --line:#26303f;
  --text:#e8edf4; --muted:#8a94a6;
  --cjk:'Zen Kaku Gothic New',-apple-system,"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--cjk);color:var(--text);background:radial-gradient(1200px 600px at 50% -10%,#16203a 0%,#0a0e16 55%);min-height:100vh}
button{font-family:var(--cjk);cursor:pointer}
.anton{font-family:'Anton',sans-serif}
a{color:var(--blue)}
code{background:var(--panel2);padding:2px 7px;border-radius:5px;color:var(--gold);font-size:13px}

/* header */
header{display:flex;align-items:center;justify-content:space-between;padding:14px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(10,14,22,.85);backdrop-filter:blur(8px);z-index:30}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer}
.logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--blue),var(--red));display:grid;place-items:center;color:#fff;font-weight:900}
.brand-text{font-weight:900;letter-spacing:.5px;font-size:17px}
.header-right{display:flex;align-items:center;gap:12px}
.header-sub{font-size:12px;color:#7b8696;letter-spacing:1px}
@media(max-width:640px){.header-sub{display:none}}
.key-btn{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);color:#cdd6e2;padding:6px 12px;border-radius:8px;font-size:12.5px;font-weight:700}
.key-btn.ready{border-color:rgba(90,208,138,.55);color:#9be8bf}
.inline-link{background:none;border:none;color:var(--gold);font-size:inherit;font-weight:700;text-decoration:underline;padding:0}
main{max-width:1900px;margin:0 auto;padding:26px 18px 60px}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(4,7,14,.72);backdrop-filter:blur(4px);display:grid;place-items:center;padding:16px;z-index:80}
.modal{width:min(480px,100%);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.modal h3{font-size:18px;font-weight:900}
.modal p{font-size:13px;color:#9aa4b4;line-height:1.65}
.key-input-row{display:flex;gap:8px}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:4px;flex-wrap:wrap}

/* toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1b2433;border:1px solid var(--gold);color:#f5e2a8;padding:10px 18px;border-radius:10px;font-size:14px;font-weight:700;z-index:100;box-shadow:0 10px 30px rgba(0,0,0,.45);transition:opacity .25s}
.toast.hide{opacity:0;pointer-events:none}

/* setup banner */
.banner{max-width:760px;margin:0 auto 18px;background:rgba(245,196,81,.1);border:1px solid var(--gold);color:#f5d98a;border-radius:10px;padding:11px 15px;font-size:13px;line-height:1.6;display:flex;gap:9px;align-items:flex-start}
.banner.ok{background:rgba(90,208,138,.1);border-color:var(--green);color:#9be8bf}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--blue);color:#fff;border:none;padding:12px 22px;border-radius:10px;font-weight:800;font-size:15px}
.btn.red{background:var(--red)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:#cdd6e2;font-weight:700}
.btn:disabled{opacity:.4;cursor:not-allowed}
.link{background:none;border:none;color:var(--muted);font-size:14px;padding:4px 0}
.input{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:9px;color:var(--text);padding:11px 13px;font-size:14px;font-family:var(--cjk)}
.input::placeholder,textarea::placeholder{color:#5a6678}

/* home */
.home{text-align:center;padding:30px 0 10px}
.hero-vs{display:flex;align-items:center;justify-content:center;gap:18px;font-size:64px;line-height:1;margin-bottom:6px}
.hero-vs .b{color:var(--blue)} .hero-vs .r{color:var(--red)} .hero-vs .w{color:#fff}
.hero-title{font-size:34px;font-weight:900;margin:8px 0 10px}
.hero-desc{color:#9aa4b4;max-width:560px;margin:0 auto 32px;line-height:1.7}
.mode-row{display:flex;gap:18px;justify-content:center;flex-wrap:wrap}
.mode-card{width:280px;padding:28px 22px;border-radius:16px;border:1px solid var(--line);background:var(--panel);color:var(--text);display:flex;flex-direction:column;align-items:center;gap:8px;transition:transform .15s,border-color .15s}
.mode-card:hover{transform:translateY(-3px)}
.mode-card.blue{border-top:3px solid var(--blue)} .mode-card.red{border-top:3px solid var(--red)}
.mode-ic{font-size:30px}
.mode-name{font-size:19px;font-weight:800;margin-top:4px}
.mode-hint{font-size:13px;color:var(--muted)}

/* setup */
.setup{max-width:760px;margin:0 auto}
.setup h2{font-size:24px;margin:12px 0 6px}
.setup p.d{color:#9aa4b4;line-height:1.7;font-size:14px;margin-bottom:16px}
.setup-row{display:flex;align-items:center;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.chip-btn{background:var(--panel2);border:1px solid var(--line);color:#cdd6e2;padding:7px 14px;border-radius:8px;font-size:13px}
.chip-btn:disabled{opacity:.45;cursor:not-allowed}
.count-tag{font-size:13px;color:#9aa4b4}
textarea{width:100%;height:200px;background:var(--panel);border:1px solid var(--line);border-radius:12px;color:var(--text);padding:14px;font-size:13.5px;line-height:1.7;resize:vertical;font-family:ui-monospace,monospace}
.import-status{font-size:13px;color:var(--gold);min-height:20px;margin-top:6px;line-height:1.5}

/* play layout */
.stage{max-width:1840px;margin:0 auto}
.hint{text-align:center;color:#7b8696;font-size:12.5px;margin-bottom:14px}
.sb-head{display:flex;align-items:center;gap:7px;font-weight:800;font-size:14px;color:#cdd6e2;margin-bottom:12px}
.sb-empty{color:#5f6b7d;font-size:13px;padding:6px 0}

/* 底部面板 */
.bottom{margin-top:18px;display:grid;grid-template-columns:1fr 1.4fr;gap:16px}
.bottom.single{grid-template-columns:1fr}
@media(max-width:760px){.bottom{grid-template-columns:1fr}}
.bp-col{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.bp-scores{display:flex;flex-wrap:wrap;gap:8px}
.bp-chip{display:inline-flex;align-items:center;gap:7px;background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:6px 12px;font-size:13.5px;font-weight:600}
.bp-rank{font-weight:900;color:var(--gold)}
.bp-pts{font-weight:800;background:#0a0e16;border-radius:10px;padding:1px 8px;margin-left:2px}
.bp-hists{display:flex;flex-direction:column;gap:7px;max-height:170px;overflow-y:auto}
.bp-hist{background:var(--panel2);border-radius:8px;padding:7px 10px;font-size:13px;display:flex;gap:8px;align-items:baseline}
.bp-hist b{color:#e8edf4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:42%}
.bp-hist span{color:#7b8696;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}
.bp-score{background:#0a0e16;border:1px solid var(--line);border-radius:8px;padding:1px 8px;font-weight:800;font-size:12.5px;color:#e8edf4;flex:none}
.bp-score i{color:#7b8696;font-style:normal;margin:0 1px}

/* 勝利動畫 */
.vcard.win-left{transform:translateX(calc(50% + 37px)) scale(1.05);transform-origin:center bottom;z-index:3}
.vcard.win-right{transform:translateX(calc(-50% - 37px)) scale(1.05);transform-origin:center bottom;z-index:3}
.vcard.lose{opacity:0;transform:scale(.82);pointer-events:none}
.divider.fade{opacity:0;transition:opacity .6s}
.reveal-note{display:inline-flex;align-items:center;gap:8px;color:#9aa4b4;font-size:14px;font-weight:600}

/* round bar & tournament progress */
.round-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.round-center{text-align:center;display:flex;flex-direction:column;gap:2px}
.round-strong{font-size:22px;font-weight:900;color:var(--gold);line-height:1}
.round-prog{font-size:12.5px;color:var(--muted)}
.round-extra{min-width:90px;text-align:right}
.live-tag{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:#9aa4b4;font-weight:700}
.tourney-prog{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.tourney-track{flex:1;height:6px;background:var(--panel2);border-radius:99px;overflow:hidden;border:1px solid rgba(38,48,63,.7)}
.tourney-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--blue),var(--gold),var(--red));transition:width .55s cubic-bezier(.22,1,.36,1)}
.tourney-meta{font-size:12px;color:#9aa4b4;font-weight:700;white-space:nowrap}
.tourney-meta b{color:var(--gold)}

/* 進場轉場微動畫（僅用 backwards，播完釋放 transform 權限不影響勝利滑動動畫） */
@keyframes cardEnterL{from{opacity:0;transform:translateX(-22px) scale(.985)}to{opacity:1;transform:none}}
@keyframes cardEnterR{from{opacity:0;transform:translateX(22px) scale(.985)}to{opacity:1;transform:none}}
@keyframes cardEnterMob{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
@keyframes vsPop{0%{opacity:0;transform:scale(.68)}70%{opacity:1;transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes champPop{0%{opacity:0;transform:scale(.4) rotate(-12deg)}65%{opacity:1;transform:scale(1.14) rotate(5deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
@keyframes champFadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

/* arena */
.arena{display:flex;align-items:stretch;gap:0}
.vcard{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:11px;transition:transform 1.35s cubic-bezier(.22,1,.30,1), opacity 1s ease, border-color .2s, box-shadow .5s}
.vcard.left{border-top:3px solid var(--blue);animation:cardEnterL .42s cubic-bezier(.22,1,.36,1) backwards}
.vcard.right{border-top:3px solid var(--red);animation:cardEnterR .42s cubic-bezier(.22,1,.36,1) .05s backwards}
.vs-badge{animation:vsPop .4s cubic-bezier(.22,1,.36,1) .08s backwards}
@media(max-width:680px){
  .arena{flex-direction:column}
  .divider{flex-direction:row!important;padding:10px 0!important}
  .divider .dl{width:auto!important;height:2px!important;flex:1}
  .vcard.left,.vcard.right{animation-name:cardEnterMob}
  .vcard.win-left,.vcard.win-right{transform:scale(1.02);transform-origin:center center}
}
@media(prefers-reduced-motion:reduce){
  .vcard.left,.vcard.right,.vs-badge,.champ-trophy,.champ-title,.champ-embed{animation:none!important}
}
.champ-trophy{font-size:64px;line-height:1;cursor:pointer;user-select:none;animation:champPop .65s cubic-bezier(.22,1,.36,1) backwards;transition:transform .15s}
.champ-trophy:hover{transform:scale(1.12)}
.champ-title{animation:champFadeUp .48s cubic-bezier(.22,1,.36,1) .12s backwards}
.champ-embed{animation:champFadeUp .52s cubic-bezier(.22,1,.36,1) .2s backwards}
.confetti-canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:90}
.vcard.voted{box-shadow:0 0 0 2px rgba(90,208,138,.5)}
.vcard.win{box-shadow:0 0 0 2px var(--gold)}
.vc-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.vc-label{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:1px}
.vc-label.gold{color:var(--gold)}
.vc-tools{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.preview-btn{background:var(--panel2);border:1px solid var(--line);color:#cdd6e2;border-radius:7px;padding:4px 10px;font-size:12px;font-weight:700}
.preview-btn.playing{border-color:var(--green);color:var(--green)}
.preview-btn.warn{color:#f5c451;border-color:rgba(245,196,81,.35)}
.preview-btn:disabled{opacity:.38;cursor:not-allowed}

/* cap selector & resume bar */
.cap-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px}
.cap-label{font-size:13px;color:#9aa4b4;font-weight:700}
.cap-chip{background:var(--panel2);border:1px solid var(--line);color:#cdd6e2;padding:6px 12px;border-radius:8px;font-size:12.5px;font-weight:700}
.cap-chip.active{background:rgba(59,111,224,.22);border-color:var(--blue);color:#9bbcff}
.resume-bar{max-width:760px;margin:0 auto 18px;background:rgba(59,111,224,.12);border:1px solid rgba(59,111,224,.55);border-radius:12px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:13.5px}
.resume-actions{display:flex;gap:8px;align-items:center}
.btn.sm{padding:7px 14px;font-size:13px;border-radius:8px}
.embed{position:relative;width:100%;padding-top:56.25%;border-radius:10px;overflow:hidden;background:#000}
.embed iframe{position:absolute;inset:0;width:100%;height:100%;border:none}
.vc-title{font-size:16px;font-weight:800;text-align:center;line-height:1.4;min-height:44px;display:flex;align-items:center;justify-content:center;overflow-wrap:anywhere}
.vote-btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:13px;border-radius:10px;border:none;color:#fff;font-weight:800;font-size:15.5px}
.vote-btn.blue{background:var(--blue)} .vote-btn.red{background:var(--red)}
.vote-btn.active{filter:brightness(1.15);box-shadow:0 0 18px rgba(90,208,138,.4)}
.reroll-row{display:flex;justify-content:center;margin-top:14px}
.reroll-btn{display:inline-flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);color:#cdd6e2;padding:10px 20px;border-radius:10px;font-weight:700;font-size:14px}
.reroll-btn.active{border-color:var(--gold);color:var(--gold);box-shadow:0 0 14px rgba(245,196,81,.3)}
.reroll-btn:disabled{opacity:.45;cursor:default}
.vote-btn:disabled{cursor:default}
.divider{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 10px;gap:8px}
.divider .dl{width:2px;flex:1;background:linear-gradient(var(--blue),var(--red));opacity:.35;border-radius:2px}
.vs-badge{font-size:22px;color:#fff;background:#0a0e16;border:2px solid var(--line);border-radius:50%;width:50px;height:50px;display:grid;place-items:center;letter-spacing:1px}

/* host bar / results */
.host-bar{margin-top:20px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap}
.host-status{display:inline-flex;align-items:center;gap:8px;color:#cdd6e2;font-size:14.5px;font-weight:600}
.result-bars{flex:1;min-width:260px}
.rb-row{display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:7px}
.rb-sub{font-size:12px;color:var(--muted);text-align:center;margin-top:6px}
.bar-track{display:flex;height:14px;border-radius:8px;overflow:hidden;background:#0a0e16}
.bar-l{background:var(--blue);transition:width .5s} .bar-r{background:var(--red);transition:width .5s}

/* champion */
.champ{text-align:center;padding:40px 0;display:flex;flex-direction:column;align-items:center;gap:10px}
.champ-label{color:var(--gold);letter-spacing:4px;font-weight:800;font-size:14px}
.champ-title{font-size:32px;font-weight:900;margin:0 0 6px;max-width:700px;overflow-wrap:anywhere}
.champ-embed{position:relative;width:min(640px,90vw);padding-top:min(360px,50.6vw);border-radius:14px;overflow:hidden;background:#000;margin-top:8px}
.champ-embed iframe{position:absolute;inset:0;width:100%;height:100%;border:none}
.champ-btns{display:flex;gap:12px;margin-top:4px;flex-wrap:wrap;justify-content:center}

/* mp setup / lobby */
.mp-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:14px}
@media(max-width:680px){.mp-grid{grid-template-columns:1fr}}
.mp-panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px 22px;display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.mp-panel h3{font-size:19px;margin:6px 0 2px}
.mp-panel p{color:#9aa4b4;font-size:13.5px;line-height:1.6;margin-bottom:4px}
.mp-panel .input{margin-top:8px}
.mp-panel .btn{margin-top:12px}
.err{margin-top:16px;background:rgba(224,65,79,.12);border:1px solid var(--red);color:#ff97a0;padding:10px 14px;border-radius:9px;font-size:13.5px;line-height:1.6}
.code-box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px 22px;text-align:center;margin-bottom:18px}
.code-label{color:var(--muted);font-size:13px;margin-bottom:8px}
.code-row{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.code-text{font-size:42px;font-weight:900;letter-spacing:8px;color:var(--gold);font-family:'Anton',sans-serif}
.copy-btn{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);color:#cdd6e2;padding:9px 14px;border-radius:9px;font-size:13px}
.lobby{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.lobby-players{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:6px 13px;font-size:13px;font-weight:600}
.chip.host{border-color:var(--blue);color:#9bbcff}

/* wait / guest */
.wait{text-align:center;padding:70px 0;display:flex;flex-direction:column;align-items:center;gap:12px}
.wait h2{font-size:20px;margin-top:6px}
.wait p{color:var(--muted);font-size:14px}
.guest-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:8px;flex-wrap:wrap}
.guest-round{color:var(--gold);font-weight:800;font-size:15px}
.guest-progress{font-size:14px;color:#cdd6e2;font-weight:600}
.guest-progress b{color:var(--gold);font-size:17px;font-weight:900}
.guest-status{margin-top:18px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 20px;display:flex;justify-content:center;min-height:56px;align-items:center}

.dot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(90,208,138,.6);animation:pulse 1.6s infinite;display:inline-block}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(90,208,138,.5)}70%{box-shadow:0 0 0 8px rgba(90,208,138,0)}100%{box-shadow:0 0 0 0 rgba(90,208,138,0)}}
.hide{display:none!important}
</style>
</head>
<body>
<header>
  <div class="brand" onclick="goHome()">
    <div class="logo">♛</div><span class="brand-text">動漫神曲二選一</span>
  </div>
  <div class="header-right">
    <button type="button" class="key-btn" id="yt-key-btn" onclick="openYtKeyModal()">🔑 設定 YT 金鑰</button>
    <span class="header-sub">OP · ED · 插曲 · 主題曲 · v17</span>
  </div>
</header>
<main id="app"></main>
<div id="toast" class="toast hide" role="status" aria-live="polite"></div>
<div id="yt-modal" class="modal-bg hide" role="dialog" aria-modal="true" aria-labelledby="yt-modal-title">
  <div class="modal">
    <h3 id="yt-modal-title">🔑 設定 YouTube Data API 金鑰</h3>
    <p>僅在匯入 <b>YouTube 播放清單網址</b>（自動抓歌名與過濾禁止嵌入影片）時需要。加入別人房間或使用 <code>標題 | 網址</code> 格式完全不需設定。</p>
    <p style="color:#cdd6e2">🔒 金鑰只保存在<b>你自己的瀏覽器</b>（localStorage），不會上傳或分享給其他玩家。</p>
    <div class="key-input-row">
      <input class="input" id="yt-key-input" type="password" placeholder="貼上你的 YouTube Data API v3 金鑰 (AIza...)" autocomplete="off" />

// 確保匿名登入（搭配 database.rules.json 保護房間與黑箱投票）
async function ensureAuth() {
  if (!auth) return ME;
  if (auth.currentUser) { ME = auth.currentUser.uid; return ME; }
  try {
    const cred = await signInAnonymously(auth);
    ME = cred.user.uid;
    return ME;
  } catch (e) {
    if (e?.code === 'auth/operation-not-allowed' || e?.code === 'auth/configuration-not-found') {
      console.warn('Firebase 尚未啟用匿名登入，暫時使用本地 UID（若已套用安全規則請於控制台啟用 Anonymous Auth）');
      ME = fallbackUid;
      return ME;
    }
    throw e;
  }
}

function fbErrMsg(e, fallback) {

  if (/permission_denied/i.test(msg)) {
    return `${fallback}：權限不足。請確認 Firebase Authentication 已啟用「匿名登入」且 Realtime Database 規則設定正確。`;
  }
  return `${fallback}：${msg}`;
}

/* ---------- YouTube 網址解析與匯入 ---------- */
function ytVideoId(url = '') {
  const s = url.trim();
  if (/^[\w-]{11}$/.test(s)) return s;
  const pats = [
    /[?&]v=([\w-]{11})/,
    /youtu\.be\/([\w-]{11})/,
    /\/embed\/([\w-]{11})/,
    /\/shorts\/([\w-]{11})/,
    /\/live\/([\w-]{11})/
  ];
  for (const p of pats) { const m = s.match(p); if (m) return m[1]; }
  return null;
}

// 只把真正的播放清單網址當作清單；若同時帶有影片 ID（例如 watch?v=...&list=RD...）則視為單支影片
function ytPlaylistId(url = '') {
  const s = url.trim();
  const m = s.match(/[?&]list=([\w-]+)/);
  if (!m) return null;
  if (/\/playlist\b/i.test(s) || !ytVideoId(s)) return m[1];
  return null;
}

async function fetchJsonChecked(url) {
  const r = await fetch(url);
  let d = null;
  try { d = await r.json(); } catch (_) {}
  if (!r.ok || d?.error) {
    throw new Error(d?.error?.message || `YouTube API 請求失敗 (HTTP ${r.status})`);
  }
  return d || {};
}

async function fetchPlaylist(pid, statusEl) {
  if (/^(RD|LL|WL|LM)/.test(pid)) {
    throw new Error('YouTube API 無法讀取自動合輯（Mix / 稍後觀看 / 喜歡的影片），請改用一般公開或不公開的播放清單');
  }
  const key = getYtApiKey();
  const MAX_ITEMS = 2000;
  let items = [], token = '';
  do {
    const u = `https://www.googleapis.com/youtube/v3/playlistItems?part=snippet&maxResults=50&playlistId=${encodeURIComponent(pid)}&key=${encodeURIComponent(key)}${token ? `&pageToken=${encodeURIComponent(token)}` : ''}`;
    const d = await fetchJsonChecked(u);
    for (const it of d.items || []) {
      const vid = safeVid(it.snippet?.resourceId?.videoId);
      const t = it.snippet?.title;
      if (vid && t && t !== 'Deleted video' && t !== 'Private video') {
        items.push({ id: uid(), videoId: vid, title: t });
      }
    }
    if (statusEl) statusEl.textContent = `正在展開播放清單…已抓 ${items.length} 首`;
    token = d.nextPageToken || '';
  } while (token && items.length < MAX_ITEMS);
  return items;
}

async function fetchVideoMeta(ids, statusEl) {
  const key = getYtApiKey();
  const map = {};
  for (let i = 0; i < ids.length; i += 50) {
    const batch = ids.slice(i, i + 50);
    const u = `https://www.googleapis.com/youtube/v3/videos?part=snippet,status&id=${encodeURIComponent(batch.join(','))}&key=${encodeURIComponent(key)}`;
    const d = await fetchJsonChecked(u);
    for (const it of d.items || []) {
      map[it.id] = {
        title: it.snippet?.title || it.id,
        embeddable: it.status?.embeddable !== false
      };
    }
    if (statusEl && ids.length > 50) {
      statusEl.textContent = `正在檢查影片資訊與嵌入權限… (${Math.min(i + 50, ids.length)}/${ids.length})`;
    }
  }
  return map;
}

// 解析使用者貼上的文字 → { songs, skippedEmbed, skippedUnavailable }
async function importSongs(text, statusEl) {
  const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
  let songs = [];
  for (const line of lines) {
    const pid = ytPlaylistId(line);
    if (pid && !line.includes('|')) {
      if (!isYtReady()) throw new Error('展開播放清單需要先設定 YouTube API 金鑰（請點右上角「🔑 設定 YT 金鑰」）');
      if (statusEl) statusEl.textContent = '正在展開播放清單…';
      const its = await fetchPlaylist(pid, statusEl);
      songs = songs.concat(its);
      continue;
    }
    if (line.includes('|')) {
      const [t, ...rest] = line.split('|');
      const vid = safeVid(ytVideoId(rest.join('|').trim()));
      if (vid) songs.push({ id: uid(), videoId: vid, title: t.trim() });
      continue;
    }
    const vid = safeVid(ytVideoId(line));
    if (vid) songs.push({ id: uid(), videoId: vid, title: '' });
  }

  // 去重（保留第一筆）
  const seen = new Set();
  songs = songs.filter(s => { if (seen.has(s.videoId)) return false; seen.add(s.videoId); return true; });

  let skippedEmbed = 0, skippedUnavailable = 0;
  if (songs.length && isYtReady()) {
    if (statusEl) statusEl.textContent = `正在抓取歌名並檢查 ${songs.length} 首影片嵌入權限…`;
    const meta = await fetchVideoMeta(songs.map(s => s.videoId), statusEl);
    songs = songs.filter(s => {
      const m = meta[s.videoId];
      if (!m) { skippedUnavailable++; return false; }
      if (!m.embeddable) { skippedEmbed++; return false; }
      if (!s.title) s.title = m.title || `影片 ${s.videoId}`;
      return true;
    });
  } else {
    songs.forEach(s => { if (!s.title) s.title = `影片 ${s.videoId}`; });
  }

  return { songs, skippedEmbed, skippedUnavailable };
}

function formatImportSummary(res) {
  const notes = [];
  if (res.skippedEmbed) notes.push(`已略過 ${res.skippedEmbed} 首禁止外部嵌入`);
  if (res.skippedUnavailable) notes.push(`已略過 ${res.skippedUnavailable} 首失效或私人影片`);
  return notes.length ? `（${notes.join('、')}）` : '';
}

const SAMPLE = `紅蓮華 | https://www.youtube.com/watch?v=CwkzK-F0Y00
怪物 YOASOBI | https://www.youtube.com/watch?v=Pa2HBChU-lw

/* ---------- 全域狀態 ---------- */
let SONGS = [];
let unsubs = []; // firebase listener cleanups
let nickTimer = null;
let HOST = null;

/* ---------- YouTube IFrame API：支援滑鼠移入（桌機）與按鈕點擊（手機/桌機）、一次一邊、沿用音量 ---------- */
const canHover = () => window.matchMedia && window.matchMedia('(hover: hover) and (pointer: fine)').matches;
const ytCbs = [];
let players = { left: null, right: null };
let playerReady = { left: false, right: false };
let activeSide = null, playingSide = null, pendingPlay = null, pendingChorus = null, volPoll = null, LAST_VOL = 50;

(function loadYTApi() {
  const t = document.createElement('script');
  t.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(t);
  window.onYouTubeIframeAPIReady = () => { ytCbs.splice(0).forEach(cb => cb()); };
})();

function playerSlot(side) { return `<div class="embed"><div id="yt-${side}"></div></div>`; }

function syncPreviewBtns() {
  ['left', 'right'].forEach(s => {
    const btn = document.getElementById(s === 'left' ? 'play-l' : 'play-r');
    if (!btn) return;
    const isPlaying = playingSide === s;
    btn.classList.toggle('playing', isPlaying);
    btn.textContent = isPlaying ? '⏸ 暫停' : '▶ 試聽';
  });
}

function captureVol() {
  const p = activeSide && players[activeSide];
  try {
    if (p && p.getVolume) {
      const v = p.getVolume();
      if (typeof v === 'number' && v >= 0 && !p.isMuted?.()) LAST_VOL = v;
    }
  } catch (_) {}
}

function playSide(side) {
  captureVol();
  ['left', 'right'].forEach(s => {
    if (s !== side) {
      try { players[s]?.pauseVideo?.(); } catch (_) {}
    }
  });
  activeSide = side;
  if (!playerReady[side]) {
    pendingPlay = side;
    return;
  }
  pendingPlay = null;
  const p = players[side];
  if (p && p.playVideo) {
    try { p.unMute?.(); p.setVolume?.(LAST_VOL); p.playVideo(); } catch (_) {}
  }
  playingSide = side;
  syncPreviewBtns();
}

function stopSide(side) {
  captureVol();
  if (pendingPlay === side) pendingPlay = null;
  if (pendingChorus === side) pendingChorus = null;
  try { players[side]?.pauseVideo?.(); } catch (_) {}
  if (activeSide === side) activeSide = null;
  if (playingSide === side) playingSide = null;
  syncPreviewBtns();
}

function seekChorus(side) {
  captureVol();
  ['left', 'right'].forEach(s => {
    if (s !== side) {
      try { players[s]?.pauseVideo?.(); } catch (_) {}
    }
  });
  activeSide = side;
  if (!playerReady[side]) {
    pendingPlay = side;
    pendingChorus = side;
    return;
  }
  pendingPlay = null;
  pendingChorus = null;
  const p = players[side];
  if (!p) return;
  // 依歌曲總長度智慧推算副歌位置：TV Size (<=115s) 約 50%，完整版約 30%，載入前預設 45 秒
  let target = 45;
  try {
    const dur = p.getDuration?.();
    if (typeof dur === 'number' && dur > 20) {
      target = dur <= 115 ? Math.round(dur * 0.50) : Math.round(dur * 0.30);
      target = Math.max(15, Math.min(target, Math.floor(dur - 12)));
    }
  } catch (_) {}
  try {
    p.unMute?.();
    p.setVolume?.(LAST_VOL);
    p.seekTo?.(target, true);
    p.playVideo?.();
  } catch (_) {}
  playingSide = side;
  syncPreviewBtns();
}

function toggleSide(side) {
  if (playingSide === side) stopSide(side);
  else playSide(side);
}

function destroyPlayers() {
  ytCbs.length = 0;
  if (volPoll) { clearInterval(volPoll); volPoll = null; }
  ['left', 'right'].forEach(s => {
    try { players[s]?.destroy?.(); } catch (_) {}
    players[s] = null;
    playerReady[s] = false;
  });
  activeSide = null;
  playingSide = null;
  pendingPlay = null;
  pendingChorus = null;
}

function mountPlayers(leftVid, rightVid) {
  const lVid = safeVid(leftVid), rVid = safeVid(rightVid);
  const make = () => {
    destroyPlayers();
    const mk = (side, vid) => ({
      host: 'https://www.youtube-nocookie.com',
      videoId: vid,
      playerVars: { rel: 0, playsinline: 1 },
      events: {
        onReady: (e) => {
          playerReady[side] = true;
          try { e.target.setVolume(LAST_VOL); } catch (_) {}
          if (pendingChorus === side) seekChorus(side);
          else if (pendingPlay === side) playSide(side);
        },
        onStateChange: (e) => {
          if (!window.YT?.PlayerState) return;
          if (e.data === YT.PlayerState.PLAYING) {
            const other = side === 'left' ? 'right' : 'left';
            try { players[other]?.pauseVideo?.(); } catch (_) {}
            activeSide = side;
            playingSide = side;
            syncPreviewBtns();
          } else if (e.data === YT.PlayerState.PAUSED || e.data === YT.PlayerState.ENDED) {
            if (playingSide === side) { playingSide = null; syncPreviewBtns(); }
          }
        }
      }
    });
    if (lVid && document.getElementById('yt-left')) players.left = new YT.Player('yt-left', mk('left', lVid));
    if (rVid && document.getElementById('yt-right')) players.right = new YT.Player('yt-right', mk('right', rVid));

    const cl = document.getElementById('card-l'), cr = document.getElementById('card-r');
    if (canHover()) {
      if (cl) { cl.onmouseenter = () => playSide('left'); cl.onmouseleave = () => stopSide('left'); }
      if (cr) { cr.onmouseenter = () => playSide('right'); cr.onmouseleave = () => stopSide('right'); }
    }
    const pl = document.getElementById('play-l'), pr = document.getElementById('play-r');
    if (pl) pl.onclick = () => toggleSide('left');
    if (pr) pr.onclick = () => toggleSide('right');
    const chl = document.getElementById('chorus-l'), chr = document.getElementById('chorus-r');
    if (chl) chl.onclick = () => seekChorus('left');
    if (chr) chr.onclick = () => seekChorus('right');
    volPoll = setInterval(captureVol, 700);
  };
  if (window.YT && window.YT.Player) make();
  else { ytCbs.length = 0; ytCbs.push(make); }
}

/* ---------- 冠軍彩帶特效（純 Canvas，免外掛） ---------- */
let confettiRaf = null, confettiCanvas = null;
function stopConfetti() {
  if (confettiRaf) { cancelAnimationFrame(confettiRaf); confettiRaf = null; }
  if (confettiCanvas) { confettiCanvas.remove(); confettiCanvas = null; }
}
function launchConfetti() {
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  stopConfetti();
  const canvas = document.createElement('canvas');
  canvas.className = 'confetti-canvas';
  document.body.appendChild(canvas);
  confettiCanvas = canvas;
  const ctx = canvas.getContext('2d');
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const resize = () => {
    canvas.width = Math.floor(window.innerWidth * dpr);
    canvas.height = Math.floor(window.innerHeight * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  };
  resize();

  const colors = ['#f5c451', '#3b6fe0', '#e0414f', '#5ad08a', '#ffffff', '#ff9f43'];
  const W = () => window.innerWidth, H = () => window.innerHeight;
  const parts = [];
  const spawnCannon = (x, y, angleBase, spread, count) => {
    for (let i = 0; i < count; i++) {
      const ang = angleBase + (Math.random() - 0.5) * spread;
      const spd = 7 + Math.random() * 11;
      parts.push({
        x, y,
        vx: Math.cos(ang) * spd,
        vy: Math.sin(ang) * spd - 2,
        w: 6 + Math.random() * 6,
        h: 4 + Math.random() * 5,
        color: colors[Math.floor(Math.random() * colors.length)],
        rot: Math.random() * Math.PI * 2,
        vrot: (Math.random() - 0.5) * 0.25,
        tilt: Math.random() * Math.PI * 2,
        vtilt: 0.08 + Math.random() * 0.12,
        life: 0,
        maxLife: 150 + Math.random() * 90
      });
    }
  };
  // 左右雙炮 + 頂部散落
  spawnCannon(W() * 0.12, H() * 0.78, -Math.PI / 3, 0.75, 55);
  spawnCannon(W() * 0.88, H() * 0.78, -2 * Math.PI / 3, 0.75, 55);
  for (let i = 0; i < 45; i++) {
    parts.push({
      x: Math.random() * W(), y: -20 - Math.random() * 120,
      vx: (Math.random() - 0.5) * 3, vy: 2.2 + Math.random() * 3.5,
      w: 6 + Math.random() * 6, h: 4 + Math.random() * 5,
      color: colors[Math.floor(Math.random() * colors.length)],
      rot: Math.random() * Math.PI * 2, vrot: (Math.random() - 0.5) * 0.18,
      tilt: Math.random() * Math.PI * 2, vtilt: 0.07 + Math.random() * 0.1,
      life: 0, maxLife: 180 + Math.random() * 80
    });
  }

  const tick = () => {
    if (confettiCanvas !== canvas) return;
    ctx.clearRect(0, 0, W(), H());
    let alive = 0;
    for (const p of parts) {
      p.life++;
      if (p.life > p.maxLife || p.y > H() + 40) continue;
      alive++;
      p.vx *= 0.985;
      p.vy = p.vy * 0.985 + 0.22;
      p.x += p.vx + Math.sin(p.tilt) * 0.6;
      p.y += p.vy;
      p.rot += p.vrot;
      p.tilt += p.vtilt;
      const alpha = p.life > p.maxLife - 40 ? Math.max(0, (p.maxLife - p.life) / 40) : 1;
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.scale(1, Math.max(0.2, Math.abs(Math.cos(p.tilt))));
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
    }
    if (alive > 0) confettiRaf = requestAnimationFrame(tick);
    else stopConfetti();
  };
  confettiRaf = requestAnimationFrame(tick);
}

const SINGLE_SAVE_KEY = 'amb_single_save_v1';

function saveSingleProgress() {
  if (!SG || !SONGS.length) return;
  try {
    localStorage.setItem(SINGLE_SAVE_KEY, JSON.stringify({
      songs: SONGS, game: SG, cap: SINGLE_CAP, savedAt: Date.now()
    }));
  } catch (_) {}

function loadSingleProgress() {
  try {
    const raw = localStorage.getItem(SINGLE_SAVE_KEY);
    if (!raw) return null;
    const d = JSON.parse(raw);
    const g = d?.game;
    if (!g || !Array.isArray(g.contestants) || g.contestants.length < 2) return null;
    if (typeof g.matchIdx !== 'number' || g.matchIdx < 0 || !g.contestants[g.matchIdx * 2 + 1]) return null;
    if (!Array.isArray(g.reserve)) g.reserve = [];
    return d;
  } catch (_) { return null; }
}
function clearSingleProgress() {
  try { localStorage.removeItem(SINGLE_SAVE_KEY); } catch (_) {}

/* =======================================================================
   淘汰賽引擎
   ======================================================================= */
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function makeGame(songs, cap = 0) {
  const pool = shuffle(songs);
  const useCap = cap > 0 && pool.length > cap;
  return {
    contestants: useCap ? pool.slice(0, cap) : pool,
    reserve: useCap ? pool.slice(cap) : [],
    next: [], matchIdx: 0, roundNo: 1, history: []
  };
}
function gameInfo(g) {
  const roundSize = g.contestants.length, total = Math.floor(roundSize / 2);
  return { roundSize, total, a: g.contestants[g.matchIdx * 2], b: g.contestants[g.matchIdx * 2 + 1] };
}
// 計算整體淘汰賽進度（單敗淘汰賽總場次永遠等於存活總曲數 - 1 + 已完成場次）
function tourneyProgress(g) {
  const done = g.history ? g.history.length : 0;
  const alive = (g.next ? g.next.length : 0) + Math.max(0, g.contestants.length - g.matchIdx * 2);
  const total = Math.max(1, done + Math.max(0, alive - 1));
  const pct = Math.min(100, Math.round((done / total) * 100));
  return { done, total, pct, isFinal: alive <= 2 };
}
function tourneyBarHTML(done, total, isFinal = false) {
  if (!total || total < 1) return '';
  const pct = Math.min(100, Math.round((done / total) * 100));
  const label = isFinal
    ? `🔥 總決賽 · <b>${done + 1} / ${total}</b> 場`
    : `總賽程 <b>${done} / ${total}</b> 場（${pct}%）`;
  return `<div class="tourney-prog" aria-label="整體賽程進度">
    <div class="tourney-track"><div class="tourney-fill" style="width:${pct}%"></div></div>
    <span class="tourney-meta">${label}</span>
  </div>`;
}
// 推進；回傳 {champion} 或 null
function advance(g, winnerSide) {
  const { roundSize, total, a, b } = gameInfo(g);
  const winner = winnerSide === 'left' ? a : b, loser = winnerSide === 'left' ? b : a;
  g.history.unshift({ winner, loser, roundNo: g.roundNo, winnerSide });
  g.next.push(winner);
  let newNext = g.next;
  if ((g.matchIdx + 1) * 2 >= roundSize - 1 && roundSize % 2 === 1) newNext = [...g.next, g.contestants[roundSize - 1]];
  if (g.matchIdx + 1 < total) { g.matchIdx++; return null; }
  if (newNext.length === 1) return { champion: newNext[0] };
  g.contestants = shuffle(newNext); g.next = []; g.matchIdx = 0; g.roundNo++;
  return null;
}

// 重抽：重新洗牌剩餘未打歌曲，並保證不抽出與原本完全相同的兩首
function rerollGame(g) {
  const start = g.matchIdx * 2;
  const remaining = g.contestants.slice(start);
  if (remaining.length <= 2) return;
  const prevA = remaining[0]?.videoId, prevB = remaining[1]?.videoId;
  const samePair = (arr) => {
    const a = arr[0]?.videoId, b = arr[1]?.videoId;
    return (a === prevA && b === prevB) || (a === prevB && b === prevA);
  };
  let nextRem = shuffle(remaining);
  for (let tries = 0; tries < 12 && samePair(nextRem); tries++) nextRem = shuffle(remaining);
  if (samePair(nextRem)) [nextRem[1], nextRem[2]] = [nextRem[2], nextRem[1]];
  g.contestants = [...g.contestants.slice(0, start), ...nextRem];
}

// 單獨替換無法播放的歌曲（優先從抽樣保留庫補位，否則從本輪尚未出場的歌曲補位並移除壞歌）
function canReplaceSong(g) {
  if (!g) return false;
  return (g.reserve && g.reserve.length > 0) || (g.contestants.length - g.matchIdx * 2 > 2);
}
function replaceSong(g, side) {
  const idx = g.matchIdx * 2 + (side === 'left' ? 0 : 1);
  if (!g.contestants[idx]) return false;
  if (g.reserve && g.reserve.length > 0) {
    g.contestants[idx] = g.reserve.pop();
    return true;
  }
  const restStart = g.matchIdx * 2 + 2;
  if (g.contestants.length > restStart) {
    const pickIdx = restStart + Math.floor(Math.random() * (g.contestants.length - restStart));
    g.contestants[idx] = g.contestants[pickIdx];
    g.contestants.splice(pickIdx, 1);
    return true;
  }
  return false;
}

/* =======================================================================
   多人 — 主持人：遊戲
   ======================================================================= */
let voteUnsub = null;
function watchRoundVotes(code, roundIdx) {
  if (voteUnsub) { try { voteUnsub(); } catch (_) {} voteUnsub = null; }
  voteUnsub = onValue(ref(db, `rooms/${code}/votes/${roundIdx}`), (snap) => {
    if (!HOST || HOST.code !== code || HOST.roundIdx !== roundIdx) return;
    HOST.votes = snap.val() || {};
    maybeAutoReveal();
    renderHost();
  });
}

async function startHostGame(code, hostNick = '主持人', cap = LOBBY_CAP) {
  clearListener();
  if (voteUnsub) { try { voteUnsub(); } catch (_) {} voteUnsub = null; }
  const sessionId = uid();
  HOST = {
    code, sessionId, hostNick,
    game: makeGame(SONGS, cap), roundIdx: 0, phase: 'voting', result: null,
    players: {}, votes: {}, myVote: null,
    revealing: false, nextTimer: null, renderedRoundIdx: -1, renderedPhase: null, champion: null
  };
  try {
    await update(ref(db, `rooms/${code}`), { history: null, votes: null, 'meta/status': 'playing' });
    await publishRound('voting');
  } catch (e) {
    showToast(fbErrMsg(e, '開始遊戲失敗'));
    hostLobby(code, { initialNick: hostNick, keepSongs: true });
    return;
  }
  if (!HOST || HOST.sessionId !== sessionId) return;
  unsubs.push(onValue(ref(db, `rooms/${code}/players`), (snap) => {
    if (!HOST || HOST.sessionId !== sessionId) return;
    HOST.players = snap.val() || {};
    maybeAutoReveal();
    renderHost();
  }));
  unsubs.push(() => { if (voteUnsub) { try { voteUnsub(); } catch (_) {} voteUnsub = null; } });
  watchRoundVotes(code, 0);
  renderHost();
}

async function publishRound(status, extra = {}) {
  const { a, b, roundSize, total } = gameInfo(HOST.game);
  const tp = tourneyProgress(HOST.game);
  await set(ref(db, `rooms/${HOST.code}/round`), {
    roundIdx: HOST.roundIdx, roundNo: HOST.game.roundNo, roundSize, total,
    matchIdx: HOST.game.matchIdx, doneMatches: tp.done, totalMatches: tp.total, isFinal: tp.isFinal,
    left: a || null, right: b || null, status, ...extra
  });
}

function tallyVotes() {
  const votes = HOST.votes || {};
  let left = 0, right = 0, reroll = 0; const map = {};
  Object.entries(votes).forEach(([pid, v]) => {
    if (!HOST.players[pid]) return; // 忽略已離線玩家的舊票
    map[pid] = v;
    if (v === 'left') left++;
    else if (v === 'right') right++;
    else if (v === 'reroll') reroll++;
  });
  return { left, right, reroll, map };
}

function playerCount() { return Object.keys(HOST.players || {}).length; }

function maybeAutoReveal() {
  if (!HOST || HOST.phase !== 'voting' || HOST.revealing) return;
  const pc = playerCount(); const { map } = tallyVotes();
  if (pc > 0 && Object.keys(map).length >= pc) triggerReveal();
}

function triggerReveal() {
  if (!HOST || HOST.revealing || HOST.phase !== 'voting') return;
  HOST.revealing = true;
  hostReveal();
}

async function hostReveal() {
  const sessionId = HOST.sessionId;
  try {
    const { left, right, reroll, map } = tallyVotes();
    const total = left + right + reroll;
    // 重抽票數過半 → 換掉這兩首，重新投票（不開票、不計分）
    if (total > 0 && reroll > total / 2) {
      await hostReroll();
      return;
    }
    const isTie = (left === right);
    const winnerSide = isTie ? (Math.random() < 0.5 ? 'left' : 'right') : (right > left ? 'right' : 'left');
    const players = HOST.players || {};
    const upd = {};
    Object.entries(map).forEach(([pid, v]) => {
      if (v === winnerSide && players[pid]) upd[`rooms/${HOST.code}/players/${pid}/score`] = (players[pid].score || 0) + 1;
    });
    if (Object.keys(upd).length) await update(ref(db), upd);
    if (!HOST || HOST.sessionId !== sessionId) return;
    HOST.phase = 'revealed';
    HOST.result = { left, right, reroll, winnerSide, isTie };
    await publishRound('revealed', { left, right, reroll, winnerSide, isTie });
    if (!HOST || HOST.sessionId !== sessionId) return;
    renderHost();
    clearTimeout(HOST.nextTimer);
    HOST.nextTimer = setTimeout(() => hostNext(sessionId), 3800);
  } catch (e) {
    if (HOST && HOST.sessionId === sessionId) HOST.revealing = false;
    showToast(fbErrMsg(e, '開票失敗，請重試'));
  }
}

async function hostReroll() {
  const sessionId = HOST.sessionId;
  rerollGame(HOST.game);
  HOST.roundIdx++; HOST.votes = {}; HOST.revealing = false; HOST.myVote = null; HOST.phase = 'voting'; HOST.result = null;
  watchRoundVotes(HOST.code, HOST.roundIdx);
  await publishRound('voting', { rerolled: true });
  if (!HOST || HOST.sessionId !== sessionId) return;
  showToast('🔀 重抽票數過半，已更換本場歌曲！');
  renderHost();
}

async function hostReplaceSong(side) {
  if (!HOST || HOST.phase !== 'voting' || HOST.revealing) return;
  if (!replaceSong(HOST.game, side)) {
    showToast('已無候補歌曲可替換，請直接讓另一首勝出');
    return;
  }
  const sessionId = HOST.sessionId;
  HOST.roundIdx++; HOST.votes = {}; HOST.revealing = false; HOST.myVote = null; HOST.phase = 'voting'; HOST.result = null;
  watchRoundVotes(HOST.code, HOST.roundIdx);
  try {
    await publishRound('voting', { replacedSide: side });
    if (!HOST || HOST.sessionId !== sessionId) return;
    showToast(`⚠️ 已替換${side === 'left' ? '左方' : '右方'}歌曲，請重新投票`);
    renderHost();
  } catch (e) {
    showToast(fbErrMsg(e, '換歌失敗'));
  }
}

async function hostNext(sessionId) {
  if (!HOST || HOST.sessionId !== sessionId) return;
  clearTimeout(HOST.nextTimer); HOST.nextTimer = null;
  const res = HOST.result; if (!res) return;
  const r = advance(HOST.game, res.winnerSide);
  const seq = HOST.game.history.length;
  if (HOST.game.history[0]) {
    HOST.game.history[0].left = res.left;
    HOST.game.history[0].right = res.right;
  }
  const latest = HOST.game.history[0];
  HOST.roundIdx++; HOST.votes = {}; HOST.phase = 'voting'; HOST.result = null; HOST.myVote = null; HOST.revealing = false;
  try {
    if (latest) {
      await set(ref(db, `rooms/${HOST.code}/history/${seq}`), {
        seq,
        winner: { title: latest.winner.title },
        loser: { title: latest.loser.title },
        left: latest.left ?? null,
        right: latest.right ?? null,
        winnerSide: latest.winnerSide || null
      });
    }
    if (!HOST || HOST.sessionId !== sessionId) return;
    if (r) {
      HOST.phase = 'done';
      HOST.champion = r.champion;
      await update(ref(db, `rooms/${HOST.code}`), {
        'meta/status': 'done',
        round: { roundIdx: HOST.roundIdx, status: 'done', champion: r.champion }
      });
    } else {
      watchRoundVotes(HOST.code, HOST.roundIdx);
      await publishRound('voting');
    }
    if (HOST && HOST.sessionId === sessionId) renderHost();
  } catch (e) {
    showToast(fbErrMsg(e, '推進下一場失敗'));
  }
}

async function hostPlayAgain(code) {
  const hostNick = HOST?.hostNick || '主持人';
  const upd = { round: null, votes: null, history: null, 'meta/status': 'lobby' };
  Object.keys(HOST?.players || {}).forEach(pid => { upd[`players/${pid}/score`] = 0; });
  try { await update(ref(db, `rooms/${code}`), upd); } catch (_) {}
  hostLobby(code, { initialNick: hostNick, keepSongs: true });
}

function exitHostRoom(code) {
  try { onDisconnect(ref(db, `rooms/${code}`)).cancel(); } catch (_) {}
  remove(ref(db, `rooms/${code}`)).catch(() => {});
  goHome();
}

function renderHost() {
  if (!HOST) return;
  const code = HOST.code;
  const players = Object.entries(HOST.players || {}).map(([id, p]) => ({ id, ...p }));
  if (HOST.phase === 'done') {
    if (HOST.renderedRoundIdx === -2) { syncBottomPanel(players, HOST.game.history); return; }
    destroyPlayers();
    const champ = HOST.champion;
    app.innerHTML = '';
    const el = $(`<div class="stage">${championHTML(champ, HOST.game.history.length)}${bottomPanel(players, HOST.game.history)}</div>`);
    app.appendChild(el);
    bindChampionFX(el);
    el.querySelector('#again').onclick = () => { stopConfetti(); hostPlayAgain(code); };
    el.querySelector('#home2').onclick = () => exitHostRoom(code);
    HOST.renderedRoundIdx = -2;
    return;
  }
  const { roundSize, total, a, b } = gameInfo(HOST.game);
  if (!a || !b) return;
  const { map } = tallyVotes();
  const voteCount = Object.keys(map).length, pc = players.length;

  // 同回合、投票中 → 只更新票數／底部，不重建影片
  if (HOST.renderedRoundIdx === HOST.roundIdx && HOST.renderedPhase === 'voting' && HOST.phase === 'voting' && document.getElementById('host-arena')) {
    const vc = document.getElementById('vcount'); if (vc) vc.textContent = voteCount;
    const pcEl = document.getElementById('pcount'); if (pcEl) pcEl.textContent = pc;
    syncBottomPanel(players, HOST.game.history);
    return;
  }
  // 同回合、投票中 → 開票：就地播放勝利動畫
  if (HOST.renderedRoundIdx === HOST.roundIdx && HOST.renderedPhase === 'voting' && HOST.phase === 'revealed' && document.getElementById('host-arena')) {
    HOST.renderedPhase = 'revealed';
    applyReveal(HOST.result.winnerSide, HOST.result.isTie);
    const hb = document.getElementById('host-bar');
    if (hb) hb.innerHTML = `${resultBarsHTML(HOST.result.left, HOST.result.right, HOST.result.reroll)}<span class="reveal-note">⏳ 即將進入下一場…</span>`;
    syncBottomPanel(players, HOST.game.history);
    return;
  }
  // 同回合、開票後的額外快照 → 只更新底部
  if (HOST.renderedRoundIdx === HOST.roundIdx && HOST.renderedPhase === 'revealed' && HOST.phase === 'revealed' && document.getElementById('host-arena')) {
    syncBottomPanel(players, HOST.game.history);
    return;
  }

  // 新的一回合 → 完整重建
  HOST.renderedRoundIdx = HOST.roundIdx; HOST.renderedPhase = HOST.phase;
  const extra = `<span class="live-tag"><span class="dot"></span> 多人房 ${esc(code)}</span>`;
  const revealed = HOST.phase === 'revealed';
  const llab = revealed && HOST.result.winnerSide === 'left' ? winLabelText(HOST.result.isTie) : '左方';
  const rlab = revealed && HOST.result.winnerSide === 'right' ? winLabelText(HOST.result.isTie) : '右方';
  const bar = revealed
    ? `<div class="host-bar" id="host-bar">${resultBarsHTML(HOST.result.left, HOST.result.right, HOST.result.reroll)}<span class="reveal-note">⏳ 即將進入下一場…</span></div>`
    : `<div class="host-bar" id="host-bar"><span class="host-status">🕶️ 黑箱投票中 · 已收到 <b style="color:var(--gold)" id="vcount">${voteCount}</b> / <b id="pcount">${pc}</b> 票</span><button class="btn ghost" id="reveal">👁️ 提前開票</button></div>`;
  const tp = tourneyProgress(HOST.game);
  app.innerHTML = '';
  const el = $(`<div class="stage" id="host-arena">${roundBarHTML(roundSize, HOST.game.matchIdx, total, extra)}${tourneyBarHTML(tp.done, tp.total, tp.isFinal)}${arenaHTML(a, b, llab, rlab, { canReroll: (roundSize - HOST.game.matchIdx * 2) > 2, showReplace: true, canReplace: canReplaceSong(HOST.game) })}${bar}${bottomPanel(players, HOST.game.history)}</div>`);
  app.appendChild(el);
  mountPlayers(a.videoId, b.videoId);
  const vl = el.querySelector('#vote-l'), vr = el.querySelector('#vote-r'), vrr = el.querySelector('#vote-reroll');
  const repl = el.querySelector('#rep-l'), repr = el.querySelector('#rep-r');
  if (revealed) {
    [vl, vr, vrr, repl, repr].forEach(b2 => { if (b2) { b2.disabled = true; b2.style.opacity = .5; } });
    applyReveal(HOST.result.winnerSide, HOST.result.isTie);
  } else {
    setVoteHighlight(el, HOST.myVote);
    const hostVote = async (side) => {
      HOST.myVote = side;
      setVoteHighlight(el, side);
      try { await set(ref(db, `rooms/${code}/votes/${HOST.roundIdx}/${ME}`), side); }
      catch (e) { showToast(fbErrMsg(e, '投票送出失敗')); }
    };
    vl.onclick = () => hostVote('left');
    vr.onclick = () => hostVote('right');
    if (vrr) vrr.onclick = () => hostVote('reroll');
    if (repl) repl.onclick = () => hostReplaceSong('left');
    if (repr) repr.onclick = () => hostReplaceSong('right');
    el.querySelector('#reveal').onclick = triggerReveal;
  }
  el.querySelector('#exit').onclick = () => exitHostRoom(code);
}

/* =======================================================================
   多人 — 參加者
   ======================================================================= */
function normalizeHistory(val) {
  if (!val) return [];
  const arr = Array.isArray(val) ? val.filter(Boolean) : Object.values(val);
  return arr.sort((a, b) => (b.seq || 0) - (a.seq || 0));
}

function guestRoom(code, nick) {
  clearListener();
  let lastIdx = -1, myVote = null, gPlayers = [], gHist = [], gRenderedRoundIdx = -1, gRenderedPhase = null, roomClosed = false;

  const leaveRoom = () => {
    try { onDisconnect(ref(db, `rooms/${code}/players/${ME}`)).cancel(); } catch (_) {}
    remove(ref(db, `rooms/${code}/players/${ME}`)).catch(() => {});
    goHome();
  };

  // 監聽房間是否存在（主持人關閉房間時立刻通知）
  unsubs.push(onValue(ref(db, `rooms/${code}/meta`), (s) => {
    if (!s.exists() && !roomClosed) {
      roomClosed = true;
      clearListener();
      showToast('⚠️ 主持人已關閉房間');
      app.innerHTML = '';
      const el = $(`<div class="wait"><div style="font-size:44px">🚪</div><h2>房間已關閉</h2><p>主持人已結束並解散房間 ${esc(code)}</p><button class="btn" id="back-home">回首頁</button></div>`);
      app.appendChild(el);
      el.querySelector('#back-home').onclick = goHome;
    }
  }));

  // 積分（玩家）
  unsubs.push(onValue(ref(db, `rooms/${code}/players`), (s) => {
    const pv = s.val() || {};
    gPlayers = Object.entries(pv).map(([id, p]) => ({ id, ...p }));
    syncBottomPanel(gPlayers, gHist);
  }));

  // 賽果
  unsubs.push(onValue(ref(db, `rooms/${code}/history`), (s) => {
    gHist = normalizeHistory(s.val());
    syncBottomPanel(gPlayers, gHist);
  }));

  // 對戰回合
  unsubs.push(onValue(ref(db, `rooms/${code}/round`), (snap) => {
    if (roomClosed) return;
    const round = snap.val();
    if (!round) {
      gRenderedRoundIdx = -1; gRenderedPhase = null; lastIdx = -1; myVote = null;
      destroyPlayers();
      renderGuestWait(code, nick, true, leaveRoom);
      return;
    }
    if (round.roundIdx !== lastIdx) {
      lastIdx = round.roundIdx;
      myVote = null;
      if (round.rerolled) showToast('🔀 重抽票數過半，已更換本場歌曲！');
      else if (round.replacedSide) showToast(`⚠️ 主持人已替換${round.replacedSide === 'left' ? '左方' : '右方'}歌曲，請重新投票`);
    }
    // 同回合、開票 → 就地播放勝利動畫，不重建影片
    if (round.status === 'revealed' && round.roundIdx === gRenderedRoundIdx && gRenderedPhase !== 'revealed' && document.getElementById('card-l')) {
      gRenderedPhase = 'revealed';
      applyReveal(round.winnerSide, round.isTie);
      const gs = document.getElementById('gs');
      if (gs) gs.innerHTML = resultBarsHTML(round.left, round.right, round.reroll);
      return;
    }
    if (round.roundIdx === gRenderedRoundIdx && gRenderedPhase === round.status && document.getElementById('card-l')) return;
    gRenderedRoundIdx = round.roundIdx; gRenderedPhase = round.status;
    renderGuest(round);
  }));

  renderGuestWait(code, nick, false, leaveRoom);

  function renderGuest(round) {
    if (round.status === 'done') {
      destroyPlayers();
      app.innerHTML = '';
      const el = $(`<div class="stage">${championHTML(round.champion, gHist.length, { isGuest: true })}${bottomPanel(gPlayers, gHist)}</div>`);
      app.appendChild(el);
      bindChampionFX(el);
      el.querySelector('#leave').onclick = leaveRoom;
      return;
    }
    const revealed = round.status === 'revealed';
    const a = round.left, b = round.right;
    if (!a || !b) return;
    const llab = revealed && round.winnerSide === 'left' ? winLabelText(round.isTie) : '左方';
    const rlab = revealed && round.winnerSide === 'right' ? winLabelText(round.isTie) : '右方';
    const status = revealed ? resultBarsHTML(round.left, round.right, round.reroll)
      : myVote ? `<span class="host-status">✓ 已投票，等待主持人開票…</span>`
      : `<span class="host-status">🕗 請選擇你支持的一首</span>`;
    app.innerHTML = '';
    const el = $(`<div class="stage">
      <div class="guest-bar">
        <span class="live-tag"><span class="dot"></span> 房 ${esc(code)} · ${esc(nick)}</span>
        <span class="guest-progress"><b>${round.roundSize ?? ''} 強</b> · 第 ${(round.matchIdx ?? 0) + 1} / ${round.total ?? ''} 場</span>
        <span class="guest-round">第 ${round.roundNo} 輪</span>
      </div>
      ${tourneyBarHTML(round.doneMatches ?? 0, round.totalMatches ?? 0, !!round.isFinal)}
      ${arenaHTML(a, b, llab, rlab, { canReroll: ((round.roundSize || 0) - (round.matchIdx || 0) * 2) > 2 })}
      <div class="guest-status" id="gs">${status}</div>
      ${bottomPanel(gPlayers, gHist)}
      <button class="link" id="leave" style="margin-top:14px">離開房間</button>
    </div>`);
    app.appendChild(el);
    mountPlayers(a.videoId, b.videoId);
    const vl = el.querySelector('#vote-l'), vr = el.querySelector('#vote-r'), vrr = el.querySelector('#vote-reroll');
    [vl, vr, vrr].forEach(b2 => { if (b2) { b2.disabled = revealed; if (revealed) b2.style.opacity = .5; } });
    setVoteHighlight(el, revealed ? null : myVote);
    if (revealed) applyReveal(round.winnerSide, round.isTie);
    const vote = async (side) => {
      if (revealed) return;
      myVote = side;
      setVoteHighlight(el, side);
      const gs = el.querySelector('#gs');
      if (gs) gs.innerHTML = `<span class="host-status">✓ 已投票（開票前可更改）</span>`;
      try { await set(ref(db, `rooms/${code}/votes/${round.roundIdx}/${ME}`), side); }
      catch (e) { showToast(fbErrMsg(e, '投票送出失敗')); }
    };
    vl.onclick = () => vote('left');
    vr.onclick = () => vote('right');
    if (vrr) vrr.onclick = () => vote('reroll');
    el.querySelector('#leave').onclick = leaveRoom;
  }
}

function renderGuestWait(code, nick, connected, onLeave) {
  app.innerHTML = '';
  const el = $(`<div class="wait"><span class="dot" style="width:14px;height:14px"></span><h2>${connected ? '已連線，等待主持人開始…' : '連線中…'}</h2><p>房號 ${esc(code)} · 暱稱 ${esc(nick)}</p><button class="btn ghost" id="leave">離開</button></div>`);
  app.appendChild(el);
  el.querySelector('#leave').onclick = onLeave;
}

/* 啟動：若有 ?room=XXXX 邀請連結則自動帶入房號 */
syncYtKeyUI();
(() => {
  const roomParam = sanitizeCode(new URLSearchParams(location.search).get('room') || '');
  if (roomParam.length >= 3 && FB_READY && db) {
    renderMpSetup({ prefillCode: roomParam });
    showToast(`已自動帶入房號 ${roomParam}，輸入暱稱即可加入！`);
  } else {
    goHome();
  }
})();
</script>
